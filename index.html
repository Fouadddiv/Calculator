<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Welcome to my Calculator</title>
    <meta name="description" content="A simple accessible calculator app">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1 class="title">Welcome to my Calculator</h1>
        <button id="installBtn" class="install-btn" aria-label="Install App" title="Install App" hidden>Install</button>
    </header>
    <div id="calk" class="calk">
        <div id="sc" class="Screen">
            <input type="text" value="" id="scr" class="Screen1" readonly>
        </div>
        <div id="button" class="but">
            <button id="cl" class="button">CLR</button>
            <button id="b(" class="button" aria-label="Open parenthesis" title="Open parenthesis">(</button>
            <button id="b)" class="button" aria-label="Close parenthesis" title="Close parenthesis">)</button>
            <button id="bdiv" class="button" aria-label="Division" title="Division">÷</button>
            <button id="b7" class="button">7</button>
            <button id="b8" class="button">8</button>
            <button id="b9" class="button">9</button>
            <button id="bmul" class="button" aria-label="Multiplication" title="Multiplication">×</button>
            <button id="b4" class="button">4</button>
            <button id="b5" class="button">5</button>
            <button id="b6" class="button">6</button>
            <button id="b-" class="button" aria-label="Subtraction" title="Subtraction">-</button>
            <button id="b1" class="button">1</button>
            <button id="b2" class="button">2</button>
            <button id="b3" class="button">3</button>
            <button id="b+" class="button" aria-label="Addition" title="Addition">+</button>
            <button id="dlt" class="button">DEL</button>
            <button id="b0" class="button">0</button>
            <button id="b." class="button" aria-label="Decimal point" title="Decimal point">.</button>
            <button id="b=" class="button" aria-label="Equals" title="Equals">=</button>
        </div>
    </div>
    <script src="js.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
